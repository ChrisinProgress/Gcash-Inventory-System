name: Deploy to GitHub Pages

on: [push, workflow_dispatch]

jobs:
  deploy:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Check Firebase web app configuration
        run: |
          node --input-type=module -e '
            import { firebaseConfig } from "./public/js/firebase-config.js";
            const required = ["apiKey", "authDomain", "projectId", "appId"];
            const missing = required.filter(key => !firebaseConfig[key]?.trim());
            if (missing.length) {
              console.error(`GitHub Pages deployment stopped. Add Firebase values for: ${missing.join(", ")} in public/js/firebase-config.js.`);
              process.exit(1);
            }
          '
      - name: Upload the static app
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy the static app
        id: deployment
        uses: actions/deploy-pages@v4
